name: New family or corporate chain
description: Propose documented nodes and ownership stakes
title: "[New chain] "
labels: ["data", "enhancement"]
body:
  - type: input
    id: snapshot
    attributes:
      label: Proposed snapshot
      placeholder: "2025-12-31"
    validations:
      required: true
  - type: textarea
    id: chain
    attributes:
      label: Corporate chain
      description: List each owner → owned entity step and its percentage
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Provide one source for each relevant step
    validations:
      required: true
