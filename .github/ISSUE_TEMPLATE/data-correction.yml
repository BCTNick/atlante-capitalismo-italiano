name: Data correction
description: Report an inaccurate or outdated node, value or relationship
title: "[Correction] "
labels: ["data", "correction"]
body:
  - type: markdown
    attributes:
      value: "Do not post private personal data. Contact the maintainer privately for sensitive information."
  - type: input
    id: snapshot
    attributes:
      label: Snapshot
      description: Date of the affected snapshot
      placeholder: "2025-12-31"
    validations:
      required: true
  - type: input
    id: record
    attributes:
      label: Node or relationship
      description: ID or label of the record to correct
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Explain what is wrong and what change you propose
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Include URL, publisher, date and the relevant page or section
    validations:
      required: true
